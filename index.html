<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1322" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EuroTrip">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.unlock input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
</style>
<title>Guia EuroTrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: uma coluna de celular (até 460px) centrada; abre no dia de hoje: destaque do dia, faixa de dias, próximo compromisso, trajeto do dia, agenda, onde dormir, pendências e consulta rápida */
:root{
  --paper:#EEF2F7;
  --card:#FFFFFF;
  --ink:#13203A;
  --muted:#56637B;
  --line:#D5DCE7;
  --cobalt:#1E4FD8;
  --cobalt-soft:#E1E8FB;
  --hero-bg:#1E4FD8;
  --hero-fg:#FFFFFF;
  --warn:#94460A;
  --warn-soft:#FBEBD3;
  --ok:#13653E;
  --ok-soft:#DDF1E5;
  --metro:#D3263A;
  --shadow:0 1px 2px rgb(19 32 58 / .06), 0 6px 18px rgb(19 32 58 / .07);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1322;--card:#161F33;--ink:#E6ECF6;--muted:#98A4BB;--line:#27324A;
  --cobalt:#86A6FF;--cobalt-soft:#1C2A52;--hero-bg:#2547B5;--hero-fg:#F3F6FF;
  --warn:#F0B565;--warn-soft:#3A2911;--ok:#72D3A2;--ok-soft:#133226;--metro:#FF6B7A;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1322;--card:#161F33;--ink:#E6ECF6;--muted:#98A4BB;--line:#27324A;
  --cobalt:#86A6FF;--cobalt-soft:#1C2A52;--hero-bg:#2547B5;--hero-fg:#F3F6FF;
  --warn:#F0B565;--warn-soft:#3A2911;--ok:#72D3A2;--ok-soft:#133226;--metro:#FF6B7A;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
button{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:6px}

.topline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:82%;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--muted);font-weight:500}
.stamp{font-size:12.5px;color:var(--muted)}

/* peças comuns */
.lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h{margin:26px 0 8px;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1.5;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--cobalt-soft);color:var(--cobalt)}
.note{margin:0;font-size:14.5px;color:var(--muted)}
.warnbox{margin:0;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14.5px;font-weight:700}
.missing{margin:0;font-size:13.5px;color:var(--warn)}
.free{margin:0;color:var(--muted);font-size:15px}
.min0{min-width:0}
.coderow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.code{display:block;font-family:var(--f-mono);font-weight:600;font-size:20px;letter-spacing:.05em;font-feature-settings:"zero" 1;word-break:break-all;-webkit-user-select:all;user-select:all}
.code.addr{font-family:var(--f-body);font-weight:700;font-size:16px;letter-spacing:0;word-break:normal}
.copy{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700;color:var(--cobalt);cursor:pointer;white-space:nowrap}
.copy.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts b{font-family:var(--f-display);font-stretch:85%;font-size:18px;font-variant-numeric:tabular-nums}
.maplink{font-weight:700;font-size:14.5px}

/* destaque do dia */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:18px 18px 20px;display:grid;gap:6px}
.hero > *{position:relative;z-index:1}
.hero::after{content:"";position:absolute;top:0;right:0;width:170px;height:100%;opacity:.17;pointer-events:none;
  background:
    radial-gradient(circle,transparent 8px,currentColor 8.5px 10.5px,transparent 11px) 0 0/34px 34px,
    linear-gradient(45deg,transparent 46%,currentColor 47% 53%,transparent 54%) 0 0/34px 34px,
    linear-gradient(-45deg,transparent 46%,currentColor 47% 53%,transparent 54%) 0 0/34px 34px;
  -webkit-mask-image:linear-gradient(to left,#000 15%,transparent);mask-image:linear-gradient(to left,#000 15%,transparent)}
.hero-k{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.hero h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:70%;font-size:clamp(34px,10.5vw,46px);line-height:.96;text-transform:uppercase;text-wrap:balance}
.hero-s{font-size:15px;opacity:.92;font-variant-numeric:tabular-nums}

/* faixa de dias */
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;width:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0 7px;display:grid;justify-items:center;gap:1px;cursor:pointer;line-height:1.1}
.dchip span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dchip b{font-family:var(--f-display);font-stretch:80%;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.dchip i{width:5px;height:5px;border-radius:50%;background:transparent}
.dchip i.on{background:var(--cobalt)}
.dchip.past{opacity:.55}
.dchip.today{border:2px solid var(--cobalt)}
.dchip.sel{background:var(--ink);border-color:var(--ink);opacity:1}
.dchip.sel span,.dchip.sel b{color:var(--paper)}
.dchip.sel i.on{background:var(--paper)}
.back{margin-top:10px;border:0;background:none;color:var(--cobalt);font-weight:700;font-size:15px;padding:4px 0;cursor:pointer}

/* próximo */
.next{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:10px;margin-top:12px}
.next-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cd{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:21px;color:var(--cobalt);font-variant-numeric:tabular-nums;white-space:nowrap}
.next-main{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.next-t{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:38px;line-height:.95;font-variant-numeric:tabular-nums}
.next-main b{display:block;font-size:17.5px;line-height:1.25}
.next-main small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.next-after{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.next-after b{color:var(--ink);font-variant-numeric:tabular-nums}

/* cartão de trajeto */
.ticket{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.ticket.dash{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px 0;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.t-route{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px;padding:6px 16px 14px}
.t-route .end{text-align:right}
.iata{font-family:var(--f-display);font-weight:800;font-stretch:72%;font-size:46px;line-height:.95;letter-spacing:.01em}
.iata.sm{font-size:30px;line-height:1.05}
.t-time{font-family:var(--f-display);font-stretch:85%;font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.t-time sup{font-size:11px;color:var(--muted);margin-left:2px}
.t-city{font-size:13px;color:var(--muted)}
.t-mid{align-self:center;display:grid;gap:4px;min-width:0;padding-bottom:18px}
.t-line{height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px);position:relative;opacity:.55}
.t-line::after{content:"";position:absolute;right:-1px;top:-4px;border-left:8px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent}
.t-via{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ev{padding:6px 16px 14px;display:grid;gap:2px}
.perf{border-top:2px dashed var(--line);margin:0 16px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.perf::before{left:-27px}.perf::after{right:-27px}
.t-body{padding:12px 16px 16px;display:grid;gap:10px}

/* estadia */
.stay{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 16px;display:grid;gap:10px}
.stay.dash{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.stay.quiet{background:transparent;box-shadow:none;border:1px solid var(--line)}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stay h4{margin:0;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:24px;line-height:1.05;text-wrap:balance}
.s-city{font-size:14px;color:var(--muted);margin-top:-6px}
.msg{display:grid;gap:8px;background:var(--paper);border-radius:12px;padding:12px}
.msg .copy{justify-self:start}
.code.msg-t{margin:0;font-family:var(--f-body);font-weight:400;font-size:14.5px;letter-spacing:0;font-feature-settings:normal;word-break:normal;white-space:pre-line}

/* agenda */
.agenda{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.agenda > .it:first-child{border-top:0}
.tm{font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}
.tm em{display:block;font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt)}
.tx{min-width:0;display:grid;gap:2px;justify-items:start}
.tx b{font-weight:700}
.tx small{color:var(--muted);font-size:14px}
.it.past{opacity:.48}
.nowline{display:flex;align-items:center;gap:8px;color:var(--cobalt);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:6px 0}
.nowline::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--cobalt)}
.nowline + .it{border-top:0}

/* pendências */
.todos{list-style:none;margin:0;padding:0}
.todo{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.todos > .todo:first-child{border-top:0}
.todo input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--cobalt)}
.todo label{cursor:pointer}
.todo.done .tx b{text-decoration:line-through;color:var(--muted)}
.when{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:2px}
.when.hot{color:var(--warn)}
.more{margin-top:6px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:700;color:var(--cobalt);cursor:pointer}
.sub-h{margin:16px 0 2px;font-size:13px;font-weight:700;color:var(--muted)}

/* consulta rápida */
.util{display:grid;gap:10px}
.util summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700}
.util summary::-webkit-details-marker{display:none}
.util details{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.util details > div{padding:0 16px 16px;display:grid;gap:10px}
.util summary small{margin-left:auto;font-weight:400;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);flex:0 0 auto}
.util details[open] .chev{transform:rotate(-135deg) translate(-2px,-1px)}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clocks b{display:block;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.clocks small{color:var(--muted);font-size:12.5px}
.metro{list-style:none;margin:0;padding:0 0 0 4px;display:grid}
.metro li{position:relative;padding:0 0 14px 24px}
.metro li:last-child{padding-bottom:0}
.metro li::before{content:"";position:absolute;left:4px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--card);border:3px solid var(--metro)}
.metro li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:18px;bottom:-4px;width:3px;background:var(--metro)}
.metro.porto{--metro:var(--cobalt)}
.metro b{display:block}
.metro small{color:var(--muted);font-size:13.5px}
.foot{margin-top:22px;font-size:13px;color:var(--muted)}
.syncst{margin:10px 0 0;font-size:13px;color:var(--muted)}
.syncst.err,.note.err{color:var(--warn)}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px;color:var(--muted)}
.steps b{color:var(--ink)}
.tok{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
</style>
</head>

<div class="wrap">
  <div class="topline"><span class="brand">Euro Trip <span>nov/2026</span></span><span class="stamp" id="stamp"></span></div>
  <main id="app"></main>
</div>

  const STORE = 'eurotrip-chave';
  const app = document.getElementById('app');
  const bytes = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const pick = s => { const m = String(s || '').match(/(?:k=)?([A-Za-z0-9_-]{43})/); return m ? m[1] : null; };
  function lock(msg){
    app.innerHTML = '<section class="hero"><div class="hero-k">Guia EuroTrip</div><h1>Página protegida</h1><div class="hero-s">' + msg + '</div></section>'

  }
  async function open(k){
    try {
      const ck = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(P.iv)}, ck, bytes(P.ct));
      try { localStorage.setItem(STORE, k); } catch(e) {}
      const s = document.createElement('script');
      s.textContent = new TextDecoder().decode(pt);
      document.body.appendChild(s);

      lock('Essa chave não abre a página. Use o link completo, com o #k= no final.');
    }
  }

  if (k) open(k); else lock('Abra pelo link com a chave.');
  addEventListener('hashchange', () => { const n = pick(location.hash); if (n && document.getElementById('unlock')) open(n); });
